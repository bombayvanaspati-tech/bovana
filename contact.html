  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact BOVANA — Herbal Tea & Herbal Cigarettes Support | Bombay Vanaspati</title>
  <meta name="description" content="Reach the BOVANA atelier in Bengaluru for questions about our herbal teas, tobacco-free herbal cigarettes, wholesale, or custom blends. We reply within 24 hours." />
  <link rel="canonical" href="https://bovana.in/contact.html" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script defer src="assets/app.js"></script>
  <script defer src="assets/page-contact.js"></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <section class="container-x contact-grid">
      <div class="contact-info reveal">
        <p class="eyebrow">Contact</p>
        <h1>We'd love to <span class="italic gold-shimmer">hear from you.</span></h1>
        <span class="gold-divider"></span>
        <p>Questions about a blend, wholesale, or a custom composition for your space? Send us a note. Every message reaches a human.</p>
        <div class="contact-meta">
          <div class="item"><span class="icon">✉</span><div><p class="eyebrow">Email</p><p>hello@bovana.in</p></div></div>
          <div class="item"><span class="icon">⌖</span><div><p class="eyebrow">Atelier</p><p>Bengaluru, India</p></div></div>
        </div>
      </div>
      <div class="reveal" data-delay="0.1">
        <form class="form" id="contact-form">
          <div class="field"><label class="eyebrow">Name</label><input name="name" placeholder="Your name"></div>
          <div class="field"><label class="eyebrow">Email</label><input type="email" name="email" placeholder="you@email.com"></div>
          <div class="field"><label class="eyebrow">Message</label><textarea name="message" rows="5" placeholder="Tell us how we can help..."></textarea></div>
          <button type="submit" class="btn btn-gold" id="contact-btn" style="width:100%">Send Message</button>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
